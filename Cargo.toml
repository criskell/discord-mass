[package]
name = "discord-mass"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
yew = { version = "0.23", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.4", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "DocumentFragment", "Node", "Element", "HtmlElement",
  "ShadowRoot", "ShadowRootInit", "ShadowRootMode",
  "HtmlInputElement", "HtmlSelectElement", "Storage", "Location",
  "Request", "RequestInit", "RequestCredentials", "Response", "Headers",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
